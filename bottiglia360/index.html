<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Esplora la bottiglia MAGGIORE MCMXXXI da ogni lato." />
<title>Scopri la bottiglia — MAGGIORE MCMXXXI</title>
<link rel="preload" as="image" href="1.webp" type="image/webp">

<style>
:root { color-scheme:dark; background:#000; --gold:#c9b28d; --muted:#99928a; }
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#eae1d5}
body{font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
.scene{position:relative;height:100vh;height:100dvh;max-height:100dvh;overflow:hidden;background:#000;isolation:isolate}
.header{position:absolute;z-index:10;top:clamp(16px,2.4vw,34px);left:clamp(18px,4vw,56px);right:clamp(18px,4vw,56px);display:flex;justify-content:space-between;align-items:start;gap:1rem}
.brand{font:500 clamp(18px,2vw,24px)/1.05 Georgia,'Times New Roman',serif;letter-spacing:.22em;text-transform:uppercase;color:#dfc29a;text-decoration:none}
.brand small{display:block;margin-top:6px;font-size:10px;letter-spacing:.31em;text-align:center;color:#a18d71}
.exit{color:#b7ab99;text-decoration:none;font-size:10px;line-height:24px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #514537}
.exit:hover,.exit:focus-visible{color:#e8d3b3;border-bottom-color:#bfa37a}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}.stage:focus-visible{outline:2px solid #c9b28d;outline-offset:-2px}
.frames{position:absolute;inset:0;pointer-events:none}
.frame{position:absolute;top:50%;left:50%;height: min(92vh,1040px);height:min(92dvh,1040px);width:auto;max-width:none;object-fit:contain;transform:translate(-50%,-49%);opacity:0;transition:opacity 100ms linear;pointer-events:none;will-change:opacity}
.frame.visible{opacity:1}
/* Only full-bottle photographs change; the label is not independently animated. */
.scene::after{content:"";position:absolute;z-index:2;bottom:0;left:0;right:0;height:108px;background:linear-gradient(to bottom,transparent,#000 90%);pointer-events:none}.footer{position:absolute;z-index:10;bottom:clamp(16px,4vh,42px);left:50%;transform:translateX(-50%);min-width:230px;display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:none}
.instructions{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#b3a48f;text-align:center;white-space:nowrap}
.instructions span{font-size:18px;vertical-align:middle;letter-spacing:0;margin:0 10px;color:#c7ac7c}
.dots{display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
.dots button{appearance:none;background:#514738;border:0;border-radius:100%;padding:0;width:5px;height:5px;cursor:pointer;transition:background 150ms,transform 150ms}
.dots button[aria-current="true"]{background:#efd3a6;transform:scale(1.55)}
.dots button:focus-visible{outline:2px solid #efd3a6;outline-offset:5px}
.note{position:absolute;z-index:10;right:clamp(18px,4vw,56px);top:clamp(70px,6vw,95px);font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#635b4f}
@media(max-width:700px){.scene::after{height:93px}.header{top:21px}.brand{font-size:16px}.brand small{font-size:8px}.frame{height:min(84dvh,780px);transform:translate(-50%,-50%)}.footer{bottom:23px;gap:14px}.instructions{font-size:9px;letter-spacing:.13em}.note{display:none}}
@media(prefers-reduced-motion:reduce){.frame,.dots button{transition:none}}
</style>
</head>
<body>
<main class="scene" aria-label="MAGGIORE: esplora sei viste della bottiglia">
 <header class="header"><a class="brand" href="/" aria-label="Torna alla homepage MAGGIORE">MAGGIORE<small>MCMXXXI</small></a><a class="exit" href="/">Torna al sito</a></header>
 <div class="stage" id="stage" tabindex="0" role="group" aria-label="Bottiglia interattiva: trascina a destra e sinistra per vedere tutta la bottiglia; usa i tasti freccia da tastiera.">
  <div class="frames" aria-hidden="true">
   <img class="frame visible" src="1.webp" alt="" fetchpriority="high" draggable="false" />
   <img class="frame" src="2.webp" alt="" loading="eager" draggable="false" />
   <img class="frame" src="3.webp" alt="" loading="eager" draggable="false" />
   <img class="frame" src="4.webp" alt="" loading="eager" draggable="false" />
   <img class="frame" src="5.webp" alt="" loading="eager" draggable="false" />
   <img class="frame" src="6.webp" alt="" loading="eager" draggable="false" />
  </div>
 </div>
 <div class="note">Anteprima digitale · 6 viste</div>
 <div class="footer"><div class="instructions"><span>↶</span>Trascina per ruotare<span>↷</span></div><div class="dots" aria-label="Scegli una vista">
  <button type="button" aria-label="Fronte" aria-current="true" data-view="0"></button>
  <button type="button" aria-label="Tre quarti destro" aria-current="false" data-view="1"></button>
  <button type="button" aria-label="Lato destro" aria-current="false" data-view="2"></button>
  <button type="button" aria-label="Retro" aria-current="false" data-view="3"></button>
  <button type="button" aria-label="Lato sinistro" aria-current="false" data-view="4"></button>
  <button type="button" aria-label="Tre quarti sinistro" aria-current="false" data-view="5"></button>
 </div></div>
</main>
<script>
(() => {
  'use strict';
  const stage=document.getElementById('stage');
  const frames=[...document.querySelectorAll('.frame')];
  const buttons=[...document.querySelectorAll('[data-view]')];
  const number=frames.length;
  let position=0,current=0,down=false,lastX=0,touchTotal=0;
  const normalize=n=>((n%number)+number)%number;
  function show(i){
    const n=normalize(i); if(n===current)return;
    frames[current].classList.remove('visible'); frames[n].classList.add('visible');
    buttons[current].setAttribute('aria-current','false');buttons[n].setAttribute('aria-current','true');
    current=n;
  }
  function step(dx){
    // Every full bottle rendering is shown as a single intact image.
    position+=dx/52;
    show(normalize(Math.round(position)));
  }
  stage.addEventListener('pointerdown',e=>{
    if(e.button !== 0 && e.pointerType==='mouse') return;
    down=true; lastX=e.clientX;touchTotal=0;
    try{stage.setPointerCapture(e.pointerId)}catch{}
  });
  stage.addEventListener('pointermove',e=>{
    if(!down)return;
    const dx=e.clientX-lastX;lastX=e.clientX;touchTotal+=Math.abs(dx);
    step(dx);
  });
  function end(){down=false}
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',end);
  stage.addEventListener('lostpointercapture',end);
  stage.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault(); position+=e.key==='ArrowLeft'?-1:1;show(normalize(Math.round(position)));
    }else if(e.key==='Home'){e.preventDefault();position=0;show(0)}
  });
  buttons.forEach(button=>button.addEventListener('click',()=>{
    const n=Number(button.dataset.view);position=n;show(n);
  }));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)end()});
})();
</script>
</body></html>
