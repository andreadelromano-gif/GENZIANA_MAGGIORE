<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Esplora MAGGIORE MCMXXXI: una simulazione ruotabile della bottiglia con etichetta originale.">
<title>MAGGIORE MCMXXXI — Esplora la bottiglia</title>
<style>
:root{color-scheme:dark;background:#080808;--gold:#c8ad83;--text:#eee8df}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#080808}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.viewer{height:100svh;height:100dvh;width:100%;position:relative;overflow:hidden;isolation:isolate;background:#080808}
.logo{position:absolute;z-index:3;left:clamp(20px,4vw,55px);top:clamp(19px,3vw,36px);font-family:Georgia,'Times New Roman',serif;font-size:clamp(16px,1.5vw,21px);letter-spacing:.23em;color:#d8bc8f;line-height:1.2;pointer-events:none;white-space:nowrap}
.logo span{display:block;margin-top:4px;font-size:9px;text-align:center;letter-spacing:.32em}
.canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;outline:none}
.canvas:active{cursor:grabbing}.canvas:focus-visible{outline:1px solid var(--gold);outline-offset:-2px}
.controls{position:absolute;bottom:clamp(22px,3vh,38px);left:50%;transform:translateX(-50%);z-index:3;display:flex;justify-content:center;align-items:center;gap:3px;padding:5px;border:1px solid #302b26;border-radius:999px;background:rgba(15,14,13,.97);box-shadow:0 10px 38px #000b;white-space:nowrap}
.controls button{appearance:none;border:none;border-radius:999px;padding:13px 18px;background:transparent;color:#978b7b;cursor:pointer;text-transform:uppercase;font-size:10px;letter-spacing:.17em;transition:background .2s,color .2s}
.controls button.selected{background:var(--gold);color:#15120f}.controls button:focus-visible{outline:2px solid #e9ce9c;outline-offset:3px}
.help{position:absolute;z-index:2;bottom:94px;left:0;right:0;text-align:center;pointer-events:none;color:#aa9e8d;text-transform:uppercase;font-size:10px;letter-spacing:.22em}
.status{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.24em;color:#b9a27f;pointer-events:none;transition:opacity .4s}
.status.done{opacity:0}.disclaimer{position:absolute;right:clamp(20px,4vw,55px);top:clamp(22px,3vw,40px);color:#827c73;font-size:10px;letter-spacing:.09em;text-transform:uppercase;pointer-events:none}
@media(max-width:700px){.logo{top:23px;left:22px;font-size:17px}.disclaimer{display:none}.controls{bottom:clamp(17px,3vh,28px)}.controls button{padding:12px 13px;font-size:9px;letter-spacing:.1em}.help{bottom:85px;letter-spacing:.16em;font-size:9px}}
@media(prefers-reduced-motion:reduce){.controls button{transition:none}}
</style>
</head>
<body>
<section class="viewer" aria-label="Visualizzatore ruotabile MAGGIORE MCMXXXI">
 <div class="logo" aria-label="MAGGIORE MCMXXXI">MAGGIORE<span>MCMXXXI</span></div>
 <span class="disclaimer">Anteprima digitale</span>
 <canvas class="canvas" id="viewer-canvas" tabindex="0" role="img" aria-label="Bottiglia di liquore MAGGIORE MCMXXXI, ruotabile trascinando con il dito o il mouse. Usa anche i tasti freccia."></canvas>
 <div class="status" id="status" aria-live="polite">CARICAMENTO BOTTIGLIA</div>
 <div class="help">↔&nbsp; Trascina per ruotare &nbsp;↔</div>
 <div class="controls" role="group" aria-label="Viste della bottiglia">
   <button type="button" class="selected" data-index="0">Fronte</button>
   <button type="button" data-index="12">Lato</button>
   <button type="button" data-index="36">Etichetta retro</button>
 </div>
</section>
<script>
(()=>{'use strict';
const FRAME_COUNT=48,FRAME_WIDTH=442,FRAME_HEIGHT=1020,COLS=4,ROWS=2,ATLAS_COUNT=6;
const canvas=document.querySelector('#viewer-canvas'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.querySelector('#status'),buttons=[...document.querySelectorAll('[data-index]')];
const atlases=Array.from({length:ATLAS_COUNT},()=>null);
let loaded=0,position=0,dragging=false,lastX=0,lastStamp=0,spin=0,zoom=1,lastShown=-1;
function fetchAtlas(i){return new Promise((resolve)=>{const img=new Image();img.decoding='async';img.onload=()=>{atlases[i]=img;loaded++;if(i===0)status.classList.add('done');draw();resolve(true)};img.onerror=()=>{if(i===0)status.textContent='Impossibile caricare le immagini';resolve(false)};img.src=`atlas-${i}.webp`;});}
// First eight angles start loading immediately, the rest follow without blocking interaction.
fetchAtlas(0).then(()=>{for(let i=1;i<ATLAS_COUNT;i++)fetchAtlas(i);});
function selectedButton(){const index=(((Math.round(position)%FRAME_COUNT)+FRAME_COUNT)%FRAME_COUNT);for(const b of buttons)b.classList.toggle('selected',Number(b.dataset.index)===index)}
buttons.forEach(b=>b.addEventListener('click',()=>{position=Number(b.dataset.index);spin=0;selectedButton();draw();}));
function closestAvailableFrame(n){n=((n%FRAME_COUNT)+FRAME_COUNT)%FRAME_COUNT;if(atlases[Math.floor(n/8)])return n;for(let k=1;k<FRAME_COUNT;k++){const r=(n+k)%FRAME_COUNT,l=(n-k+FRAME_COUNT)%FRAME_COUNT;if(atlases[Math.floor(r/8)])return r;if(atlases[Math.floor(l/8)])return l;}return -1;}
function sizing(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}return{w,h,dpr}}
function draw(){const{w,h}=sizing();ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h);const ix=closestAvailableFrame(Math.round(position));if(ix<0)return;lastShown=ix;
 const atlas=atlases[Math.floor(ix/8)],local=ix%8,c=local%COLS,r=Math.floor(local/COLS);
 const maxH=h*(w/h<.7?.78:.81);const naturalWidth=maxH*FRAME_WIDTH/FRAME_HEIGHT;
 const maxW=w*(w/h<.7?.88:.55);
 const dh=Math.min(maxH,maxW*FRAME_HEIGHT/FRAME_WIDTH)*zoom,dw=dh*FRAME_WIDTH/FRAME_HEIGHT;
 const top=(h-dh)/2-(w/h<.7?.015*h:.005*h),left=(w-dw)/2;
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(atlas,c*FRAME_WIDTH,r*FRAME_HEIGHT,FRAME_WIDTH,FRAME_HEIGHT,left,top,dw,dh);
}
function down(e){dragging=true;lastX=e.clientX;lastStamp=performance.now();spin=0;try{canvas.setPointerCapture(e.pointerId)}catch{}}
function move(e){if(!dragging)return;let dx=e.clientX-lastX;lastX=e.clientX;const stamp=performance.now(),dt=Math.max(8,stamp-lastStamp);lastStamp=stamp;const step=dx/10.5;position+=step;spin=Math.max(-.45,Math.min(.45,step*16/dt));selectedButton();draw();}
function up(){dragging=false;}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('lostpointercapture',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.28,Math.max(.82,zoom-e.deltaY*.0007));draw()},{passive:false});
canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();position-=1;spin=0;selectedButton();draw();}if(e.key==='ArrowRight'){e.preventDefault();position+=1;spin=0;selectedButton();draw();}if(e.key==='Home'){e.preventDefault();position=0;spin=0;selectedButton();draw();}});
let prev=0;function animate(time){let dt=Math.min(33,(time-prev)||16);prev=time;if(!dragging&&Math.abs(spin)>.003){position+=spin*dt/16;spin*=Math.pow(.88,dt/16);selectedButton();draw();}requestAnimationFrame(animate)}
requestAnimationFrame(animate);
window.addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{if(document.hidden)spin=0});draw();
})();
</script>
</body>
</html>
